name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches new Home Assistant or HACS rules

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@2026.11.0

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration
          # Brand images live in home-assistant/brands; not submitted yet.
          ignore: brands
